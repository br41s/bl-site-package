<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <!--
      Fallback only. src/not-found.js sends the page Eleventy builds from
      site/404.njk (nav, footer and the site's style) and falls back to this
      file while no build exists yet. There is no config to draw a nav from
      here, so it keeps to the message. Same markup as site/404.njk.
    -->
    <main class="site-404"><section class="site-404-inner">
      <p class="site-404-code">404</p>
      <h1 class="site-404-title">Página no encontrada</h1>
      <a href="/" class="site-btn">Volver al inicio</a>
    </section></main>
    <script src="/site.js"></script>
  </body>
</html>
