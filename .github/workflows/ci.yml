name: CI

# Both triggers matter. `pull_request` gates the agent PRs; `push` to main
# catches anything that lands without one, which branch protection cannot
# prevent on this account.
on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node — node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # package.json pins "node": ">=22"; better-sqlite3 and sharp resolve
      # prebuilt binaries for this line, so no toolchain compile step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite is 282 tests in ~1.2s and needs no database: the API and
      # build tests stub their own storage. Deliberately NOT running
      # `npm run build` — eleventy.config.mjs reads live SQLite content via
      # site/_data/*, so a build here would assert nothing and fail on an
      # empty DB.
      - name: Test
        run: npm test
