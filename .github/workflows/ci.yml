name: CI

# Both triggers matter. `pull_request` gates the agent PRs; `push` to main
# catches anything that lands without one, which branch protection cannot
# prevent on this account.
on:
  pull_request:
  push:
    branches: [main]

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node — node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # package.json pins "node": ">=22"; better-sqlite3 and sharp resolve
      # prebuilt binaries for this line, so no toolchain compile step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite is 282 tests in ~1.2s and needs no database: the API and
      # build tests stub their own storage. Deliberately NOT running
      # `npm run build` — eleventy.config.mjs reads live SQLite content via
      # site/_data/*, so a build here would assert nothing and fail on an
      # empty DB.
      - name: Test
        run: npm test

  # The gate that RELEASE.md step 2 describes. It ran only on a developer's
  # machine until now, which is exactly how v1.8.3 shipped the table-scroll
  # change with no bump: CI was green, nothing else asked, and the omission was
  # only caught days later while preparing a manual deploy. A gate nobody is
  # forced to run is a checklist item, not a gate.
  version:
    name: Version bump
    # On push to main HEAD *is* origin/main, so the gate would report
    # "no changes" and pass trivially. It only means something on a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs origin/main...HEAD and reads package.json from both
          # sides. The default shallow clone has no merge-base to diff against.
          fetch-depth: 0
          # Check out the branch tip, NOT the default refs/pull/N/merge commit.
          # That merge commit already carries main's package.json, which would
          # mask the "regressed" verdict this gate exists to catch: a branch cut
          # from an older main landing a version BELOW the one main is on.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci` on purpose: the gate imports only node: builtins, so this
      # job stays a few seconds regardless of the dependency tree.
      - name: Check version bump
        run: node scripts/check-version-bump.mjs
